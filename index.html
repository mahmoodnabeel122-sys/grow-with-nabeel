<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Sales Force Team</title>

    <style>

        /* PAGE BACKGROUND */
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                120deg,
                #198754 0%,
                darkorange 33%,
                white 33%,
                green 66%,
                darkorange 33%,
                white 33%,
                green 100%
            );
        }
       /* NAVIGATION BAR */
.navbar {
    background:linear-gradient(
        blue 20%,
        pink 20%,
    );
    padding: 15px;
    text-align: center;
}

.navbar a {
    color: green;
    text-decoration: none;
    margin: 0 20px;
    font-size: 18px;
    font-weight: bold;
}

.navbar a:hover {
    color: orange;
}

        /* MAIN HEADING */
        .center {
            color: white;
            text-align: center;
            padding: 25px;
        }

        .center h1 {
            margin: 0;
            font-size: 35px;
        }

        .center p {
            font-size: 18px;
        }


        /* CONTAINER FOR BUY AND SELL */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;

            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }


        /* BUY PRODUCTS */
        .buyproducts {
            background-color: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }


        /* SELL PRODUCTS */
        .sellproducts {
            background-color: orange;

            padding: 25px;

            border-radius: 15px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }


        /* FORM HEADINGS */
        h2 {
            text-align: center;
            color: #333;
        }


        /* LABELS */
        label {
            display: block;

            margin-top: 12px;
            margin-bottom: 5px;

            font-weight: bold;
        }


        /* TEXTAREA */
        textarea {
            width: 100%;
            height: 60px;

            padding: 8px;

            box-sizing: border-box;

            border: 1px solid #aaa;
            border-radius: 5px;

            resize: vertical;
        }


        /* SELECT */
        select {
            width: 100%;

            padding: 10px;

            box-sizing: border-box;

            border: 1px solid #aaa;
            border-radius: 5px;

            background-color: white;
        }


        /* INPUT */
        input {
            width: 100%;

            padding: 10px;

            box-sizing: border-box;

            border: 1px solid #aaa;
            border-radius: 5px;
        }


        /* BUTTON */
        button {
            width: 100%;

            margin-top: 20px;

            padding: 12px;

            border: none;
            border-radius: 7px;

            background-color: #007bff;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        button:hover {
            background-color: #0056b3;
        }


        /* FOOTER */
        .amazon {
            background-color: #222;

            color: white;

            text-align: center;

            padding: 20px;

            margin-top: 20px;
        }

        .amazon header {
            font-size: 25px;

            font-weight: bold;
        }

        .amazon footer {
            color: #ccc;
        }


        /* MOBILE SCREEN */
        @media (max-width: 700px) {

            .container {
                grid-template-columns: 1fr;
            }

            .center h1 {
                font-size: 25px;
            }

        }

    </style>
</head>
